name: Validate Brain-Only documentation
on:
  push:
    branches: [main, 'fix/**', 'feature/**']
  pull_request:
jobs:
  docs-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_validate_docs.py' -v
      - name: Validate Markdown and JSON fixtures
        run: python scripts/validate_docs.py
